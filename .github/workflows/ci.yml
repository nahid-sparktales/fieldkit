name: Navigated Support verification
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: fieldkit_test
          POSTGRES_PASSWORD: fieldkit-test-password
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:fieldkit-test-password@localhost:5432/fieldkit_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/demo/package-lock.json
      - run: npm ci
      - name: Check dependency advisories
        run: npm audit --audit-level=high
      - run: npx tsc --noEmit --noUnusedLocals --noUnusedParameters
      - run: npm run build
      - run: npm test
      - name: Verify isolated Python and JavaScript execution
        run: |
          docker build -f runner/Dockerfile -t fieldkit-runner:local .
          npm run test:runner
      - run: npm ci --prefix examples/demo
      - run: npm run test:demo
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: docker build -t fieldkit:local .
      - name: Verify fresh Compose installation and worker
        run: |
          node scripts/setup.ts
          docker compose up -d --no-build
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:4317/v2/readiness; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:4317/v2/readiness
          curl --fail http://127.0.0.1:4317/v2/installation
          docker compose exec -T app npm run migrate
          docker compose restart worker
          sleep 5
          curl --fail http://127.0.0.1:4317/v2/readiness
      - name: Verify real private attachment scanner
        timeout-minutes: 10
        run: |
          # The first startup downloads signatures. The check uses only harmless
          # synthetic text and the standard EICAR test string, never user files.
          verify_scanner() {
            for attempt in $(seq 1 40); do
              if docker compose exec -T -e FIELDKIT_CLAM_HOST=scanner -e FIELDKIT_SCAN_TIMEOUT_MS=5000 app npm run test:scanner -- --live-scanner; then return 0; fi
              sleep 5
            done
            # Compare loaded-engine diagnostics above with the downloaded database.
            docker compose exec -T scanner sh -c 'date -u; for db in /var/lib/clamav/daily.cvd /var/lib/clamav/daily.cld; do if [ -f "$db" ]; then sigtool --info "$db"; fi; done'
            return 1
          }
          docker compose --profile attachments up -d scanner
          verify_scanner
          # A retained volume must also be refreshed before loading on restart.
          docker compose --profile attachments restart scanner
          verify_scanner
      - name: Container logs
        if: always()
        run: test ! -f .env || docker compose --profile attachments logs --no-color --tail=60
      - name: Stop containers
        if: always()
        run: test ! -f .env || docker compose --profile attachments down -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: |
            playwright-report/
            test-results/
